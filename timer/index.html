<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>無人機計時器</title>
<meta name="description" content="計時器：計時的時候無人機在沙漠裡到處飛，時間到就掉下來。">
<meta name="theme-color" content="#0b1015">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="空拍計時">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap">
<style>
/* Layout: the 3D desert fills the screen; one glass layer on top at a time: the time setting card, the countdown with its controls, or the "time's up" card. Dark on purpose, like the game's HUD. */
:root{
  color-scheme:dark;
  --bg:#0b1015;
  --glass:rgba(12,18,24,.64);
  --glass-2:rgba(22,30,38,.82);
  --line:rgba(220,235,245,.16);
  --fg:#f3f6f8;
  --muted:#aab6bf;
  --accent:#8c74ff;
  --accent-ink:#130a33;
  --ok:#55d68f;
  --crit:#ff6159;
  --f-data:"Azeret Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(8,12,16,.42) 0%,rgba(8,12,16,0) 32%,rgba(8,12,16,0) 55%,rgba(8,12,16,.55) 100%);transition:opacity .5s}
.shade.dim{background:rgba(8,12,16,.38)}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;gap:14px;
  padding-top:max(18px,calc(env(safe-area-inset-top,0px) + 10px));padding-bottom:max(18px,calc(env(safe-area-inset-bottom,0px) + 12px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.screen > *{pointer-events:auto}
.spacer{flex:1;pointer-events:none!important}
.brand{text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.5)}
.eyebrow{font:600 12px/1.2 var(--f-body);letter-spacing:.14em;color:#ffd7ae}
h1{margin:4px 0 0;font:900 clamp(28px,7.5vw,40px)/1.15 var(--f-display)}
.card{width:min(460px,100%);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:18px 16px 16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.setup{background:#000;gap:0}
.setup .ttl{font:500 13px/1.2 var(--f-body);letter-spacing:.14em;color:#8f8f99;text-align:center}
.bell{position:absolute;top:max(14px,calc(env(safe-area-inset-top,0px) + 8px));right:max(14px,env(safe-area-inset-right,0px));appearance:none;width:44px;height:44px;border-radius:50%;border:1px solid #2a2a33;background:#111116;color:#fff;display:grid;place-items:center;cursor:pointer}
.bell svg{width:22px;height:22px;fill:currentColor}
.bell .off{display:none}
.bell[aria-pressed="false"]{color:#77777f}
.bell[aria-pressed="false"] .off{display:block}
.picker{--row:clamp(46px,min(15vw,11vh),92px);position:relative;display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;width:min(440px,100%);touch-action:pan-y}
.band{position:absolute;left:4%;right:4%;top:calc(50% - var(--row) / 2);height:var(--row);border-top:1.5px solid rgba(255,255,255,.3);border-bottom:1.5px solid rgba(255,255,255,.3);pointer-events:none}
.wheel{height:calc(var(--row) * 3);overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;outline:none;cursor:grab;-webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.35),#000 30%,#000 70%,rgba(0,0,0,.35));mask-image:linear-gradient(180deg,rgba(0,0,0,.35),#000 30%,#000 70%,rgba(0,0,0,.35))}
.wheel::-webkit-scrollbar{display:none}
.wheel .pad{height:var(--row)}
.wheel .it{height:var(--row);display:grid;place-items:center;scroll-snap-align:center;font:600 calc(var(--row) * .5)/1 var(--f-body);font-variant-numeric:tabular-nums;color:rgba(255,255,255,.9);transition:font-size .12s,color .12s}
.wheel .it.sel{font-weight:700;font-size:calc(var(--row) * .74);color:#fff}
.wheel.on .it.sel{color:var(--accent)}
.wheel:focus-visible{box-shadow:inset 0 0 0 2px rgba(140,116,255,.6);border-radius:12px}
.sep{font:700 calc(var(--row) * .6)/1 var(--f-body);color:#fff;padding:0 .15em;margin-top:-.12em}
.units{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;width:min(440px,100%);margin-top:6px;color:#77777f;font-size:12.5px;letter-spacing:.12em;text-align:center}
.units i{width:calc(var(--row, 60px) * .3)}
.pill{appearance:none;width:min(440px,100%);height:clamp(54px,min(15vw,10vh),76px);border:0;border-radius:999px;background:var(--accent);color:#2a1f63;font:700 clamp(20px,min(6vw,4vh),30px)/1 var(--f-body);letter-spacing:.08em;cursor:pointer;touch-action:manipulation;margin-top:clamp(14px,4vh,34px)}
.pill:disabled{opacity:.4;cursor:default}
.pill:focus-visible{outline:2px solid #fff;outline-offset:3px}
.pill:active{transform:translateY(1px)}
.row{display:flex;gap:10px}
.btn{appearance:none;border:1px solid var(--line);background:var(--glass-2);color:var(--fg);font:700 16px/1 var(--f-body);height:52px;padding:0 16px;border-radius:14px;cursor:pointer;touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px;fill:currentColor}
.btn.go{flex:1;background:var(--accent);color:var(--accent-ink);border-color:transparent;font-size:18px;box-shadow:0 8px 24px rgba(140,116,255,.3)}
.btn.go:disabled{opacity:.45;box-shadow:none;cursor:default}
.btn.toggle[aria-pressed="false"]{color:var(--muted)}
.btn:focus-visible{outline:2px solid #8fc3ee;outline-offset:2px}
.btn:active{transform:translateY(1px)}
.hint{margin:0;color:var(--muted);font-size:13px;line-height:1.55;text-align:center}
/* countdown */
.clock{display:flex;flex-direction:column;align-items:center;gap:8px;text-shadow:0 3px 18px rgba(0,0,0,.55)}
/* the countdown hangs like a sign from two steel posts that come down from the top of the screen */
.hang{position:relative;margin-top:clamp(18px,5vh,46px)}
.rod{position:absolute;bottom:calc(100% - 6px);width:10px;height:100vh;border-radius:3px;background:linear-gradient(90deg,#6f7880 0%,#d9dfe4 38%,#f4f7f9 50%,#a9b2ba 70%,#5f676e 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25),2px 0 8px rgba(0,0,0,.25)}
.rod.l{left:16%}
.rod.r{right:16%}
.rod::after{content:"";position:absolute;left:50%;bottom:-2px;width:26px;height:12px;transform:translateX(-50%);border-radius:4px;background:linear-gradient(180deg,#e9edf0,#9aa3ab);box-shadow:0 1px 3px rgba(0,0,0,.4)}
.board{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:clamp(10px,2.4vw,16px) clamp(18px,5vw,30px) clamp(12px,2.6vw,16px);border-radius:20px;background:rgba(10,14,20,.58);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:4px solid #c3cbd2;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.18),0 14px 34px rgba(0,0,0,.4)}
.board .batt{background:transparent;border:0;padding:0;-webkit-backdrop-filter:none;backdrop-filter:none}
.big{font:700 clamp(64px,20vw,120px)/1 var(--f-data);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big.paused{animation:blink 1.2s steps(2,start) infinite}
@keyframes blink{to{opacity:.35}}
.batt{display:flex;align-items:center;gap:10px;font:600 13px/1 var(--f-data);color:var(--fg);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 12px 7px 10px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cell{position:relative;width:34px;height:15px;border:2px solid currentColor;border-radius:4px}
.cell::after{content:"";position:absolute;right:-5px;top:3px;width:3px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.cell i{position:absolute;left:1px;top:1px;bottom:1px;width:calc(100% - 2px);background:var(--ok);border-radius:1px;transform-origin:left center}
.batt.low .cell i{background:var(--crit)}
.batt.mid .cell i{background:#ffc04d}
.controls{display:flex;gap:10px;width:min(460px,100%)}
.controls .btn{flex:1;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.controls .btn.main{background:var(--accent);color:var(--accent-ink);border-color:transparent}
/* time's up */
.up{text-align:center;align-items:center}
.up h2{margin:0;font:900 clamp(36px,10vw,52px)/1.1 var(--f-display);color:#ffd7ae}
.up p{margin:0;color:var(--muted)}
.up .row{width:100%}
.up .btn{flex:1}
.fade{position:fixed;inset:0;background:#0b1015;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}
.nogl{position:fixed;left:0;right:0;top:40%;text-align:center;color:var(--muted);padding:0 24px}
@media (max-height:620px){.card{gap:10px;padding:14px 14px 12px}.btn{height:46px}}
@media (prefers-reduced-motion:reduce){.big.paused{animation:none;opacity:.6}}
</style>
</head>
<body>
<canvas id="cv" aria-hidden="true"></canvas>
<div class="shade dim" id="shade"></div>
<p class="nogl" id="nogl" hidden>這台裝置沒辦法顯示 3D 畫面，計時器一樣可以用。</p>

<section class="screen setup" id="setup" aria-label="設定時間">
  <div class="ttl">無人機計時器</div>
  <button class="bell" id="sound" type="button" aria-pressed="true" aria-label="鈴聲：開"><svg viewBox="0 0 24 24"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8a2.5 2.5 0 0 0 2.4 2zm7-6V11a7 7 0 0 0-5.5-6.8V3.5a1.5 1.5 0 0 0-3 0v.7A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/><path class="off" d="M3.3 2.3l18.4 18.4-1.4 1.4L1.9 3.7z" stroke="#000" stroke-width="1.2"/></svg></button>
  <div class="spacer"></div>
  <div class="picker" id="picker" role="group" aria-label="設定時間">
    <div class="band" aria-hidden="true"></div>
    <div class="wheel" id="wH" tabindex="0" role="spinbutton" aria-label="小時" aria-valuemin="0" aria-valuemax="23"></div>
    <span class="sep" aria-hidden="true">:</span>
    <div class="wheel" id="wM" tabindex="0" role="spinbutton" aria-label="分鐘" aria-valuemin="0" aria-valuemax="59"></div>
    <span class="sep" aria-hidden="true">:</span>
    <div class="wheel" id="wS" tabindex="0" role="spinbutton" aria-label="秒" aria-valuemin="0" aria-valuemax="59"></div>
  </div>
  <div class="units" aria-hidden="true"><span>時</span><i></i><span>分</span><i></i><span>秒</span></div>
  <button class="pill" id="start" type="button">開始</button>
  <div class="spacer"></div>
</section>

<section class="screen" id="run" aria-label="計時中" hidden>
  <div class="clock hang">
    <span class="rod l" aria-hidden="true"></span><span class="rod r" aria-hidden="true"></span>
    <div class="board">
      <div class="big" id="left" role="timer" aria-label="剩下的時間">05:00</div>
      <div class="batt" id="batt"><span class="cell"><i id="cellFill"></i></span><span id="battTxt">電量 100%</span><span style="color:var(--muted)">・共 <span id="totalTxt">5:00</span></span></div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <button class="btn main" id="pause" type="button"><svg viewBox="0 0 24 24"><path id="pauseIco" d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg><span id="pauseTxt">暫停</span></button>
    <button class="btn" id="plus" type="button">＋1 分</button>
    <button class="btn" id="stop" type="button"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>停止</button>
  </div>
</section>

<section class="screen" id="done" aria-label="時間到" hidden>
  <div class="spacer"></div>
  <div class="card up" role="alertdialog" aria-labelledby="doneT" aria-describedby="doneP">
    <h2 id="doneT">時間到！</h2>
    <p id="doneP">電量用完，無人機掉到沙漠裡了。</p>
    <div class="row">
      <button class="btn go" id="again" type="button">再計一次 <span id="againTxt">5:00</span></button>
      <button class="btn" id="reset" type="button">設定時間</button>
    </div>
  </div>
</section>
<div class="fade" id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, String(v)); } catch (e) {} },
  };
  const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
  const mix = (a, b, t) => a + (b - a) * t;
  const TAU = Math.PI * 2;
  const fmtLeft = ms => { const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : String(m).padStart(2, '0')) + ':' + String(ss).padStart(2, '0'); };
  const fmtShort = ms => { const s = Math.round(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(ss).padStart(2, '0'); };

  /* ---------------- timer state ---------------- */
  const MAX_MS = (23 * 3600 + 59 * 60 + 59) * 1000;
  let durMs = clamp(+store.get('drone-timer-ms', 300000) || 300000, 1000, MAX_MS);
  let soundOn = store.get('drone-timer-sound', '1') === '1';
  let state = 'setup';           // setup | running | paused | done
  let endAt = 0, leftMs = durMs, totalMs = durMs, lastBeep = -1;

  /* the three wheels (hours : minutes : seconds), like a watch: drag, scroll, tap a number, or use the arrow keys */
  function makeWheel(el, max, onChange) {
    el.innerHTML = '<div class="pad"></div>' + Array.from({ length: max + 1 }, (_, i) => `<div class="it">${String(i).padStart(2, '0')}</div>`).join('') + '<div class="pad"></div>';
    const items = [...el.querySelectorAll('.it')];
    const rowH = () => items[0].getBoundingClientRect().height || 60;
    let val = 0, drag = null, moved = 0, snapT = null;
    function mark(v) { items.forEach((it, i) => it.classList.toggle('sel', i === v)); el.setAttribute('aria-valuenow', String(v)); }
    function set(v, smoothly, quiet) {
      v = clamp(v, 0, max); const changed = v !== val; val = v; mark(v);
      el.scrollTo({ top: v * rowH(), behavior: smoothly && !reduce ? 'smooth' : 'auto' });
      if (changed && !quiet) onChange();
    }
    el.addEventListener('scroll', () => {
      const v = clamp(Math.round(el.scrollTop / rowH()), 0, max);
      if (v !== val) { val = v; mark(v); onChange(); }
      if (!drag) { clearTimeout(snapT); snapT = setTimeout(() => { if (Math.abs(el.scrollTop - val * rowH()) > 1) set(val, true, true); }, 160); }
    }, { passive: true });
    items.forEach((it, i) => it.addEventListener('click', () => { if (moved > 4) return; activate(el); set(i, true); }));
    el.addEventListener('keydown', e => {
      const d = { ArrowUp: -1, ArrowDown: 1, PageUp: -10, PageDown: 10 }[e.key];
      if (d) { e.preventDefault(); activate(el); set(val + d, true); }
      else if (e.key === 'Home') { e.preventDefault(); set(0, true); } else if (e.key === 'End') { e.preventDefault(); set(max, true); }
      else if (e.key === 'Enter') { e.preventDefault(); $('start').click(); }
    });
    el.addEventListener('focus', () => activate(el));
    el.addEventListener('pointerdown', e => {
      activate(el); moved = 0;
      if (e.pointerType !== 'mouse') return;          // fingers scroll natively; a mouse drags
      drag = { y: e.clientY, top: el.scrollTop }; el.style.scrollSnapType = 'none'; el.style.cursor = 'grabbing';
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
    });
    el.addEventListener('pointermove', e => { if (!drag) return; moved = Math.max(moved, Math.abs(e.clientY - drag.y)); el.scrollTop = drag.top - (e.clientY - drag.y); });
    const end = () => { if (!drag) return; drag = null; el.style.scrollSnapType = ''; el.style.cursor = ''; set(Math.round(el.scrollTop / rowH()), true); };
    el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
    el.addEventListener('wheel', e => { if (Math.abs(e.deltaY) < 1) return; e.preventDefault(); set(val + Math.sign(e.deltaY), true); }, { passive: false });
    return { get: () => val, set, el };
  }
  const wheels = {};
  function activate(el) { Object.values(wheels).forEach(w => w.el.classList.toggle('on', w.el === el)); }
  function readDial() { return ((wheels.h.get() * 60 + wheels.m.get()) * 60 + wheels.s.get()) * 1000; }
  function dialChanged() { const ms = readDial(); durMs = ms; $('start').disabled = ms <= 0; }
  function writeDial(ms, smoothly) {
    const s = Math.round(clamp(ms, 0, MAX_MS) / 1000);
    wheels.h.set(Math.floor(s / 3600), smoothly, true); wheels.m.set(Math.floor(s % 3600 / 60), smoothly, true); wheels.s.set(s % 60, smoothly, true);
    durMs = ms; $('start').disabled = ms <= 0;
  }
  wheels.h = makeWheel($('wH'), 23, dialChanged);
  wheels.m = makeWheel($('wM'), 59, dialChanged);
  wheels.s = makeWheel($('wS'), 59, dialChanged);
  activate(wheels.m.el);
  addEventListener('resize', () => { if (state === 'setup') writeDial(durMs); });
  function setSound(v) { soundOn = v; store.set('drone-timer-sound', v ? '1' : '0'); $('sound').setAttribute('aria-pressed', v ? 'true' : 'false'); $('sound').setAttribute('aria-label', v ? '鈴聲：開' : '鈴聲：關'); }
  $('sound').addEventListener('click', () => setSound(!soundOn));
  setSound(soundOn); writeDial(durMs);

  function show(which) {
    for (const id of ['setup', 'run', 'done']) $(id).hidden = id !== which;
    $('shade').classList.toggle('dim', which !== 'run');
    if (which === 'setup') requestAnimationFrame(() => writeDial(durMs));
  }
  function fadeThen(fn) { const f = $('fade'); f.classList.add('on'); setTimeout(() => { fn(); requestAnimationFrame(() => f.classList.remove('on')); }, 360); }

  function startTimer(ms) {
    unlockAudio(); stopAlarm();
    totalMs = leftMs = ms; endAt = Date.now() + ms; lastBeep = -1;
    store.set('drone-timer-ms', ms);
    state = 'running'; fly.start();
    $('totalTxt').textContent = fmtShort(ms); $('againTxt').textContent = fmtShort(ms);
    setPaused(false); show('run'); wake(); updateHud();
  }
  function setPaused(p) {
    $('pauseIco').setAttribute('d', p ? 'M7 4.5v15L19.5 12z' : 'M6.5 5h4v14h-4zM13.5 5h4v14h-4z');
    $('pauseTxt').textContent = p ? '繼續' : '暫停';
    $('left').classList.toggle('paused', p);
  }
  function togglePause() {
    if (state === 'running') { leftMs = Math.max(0, endAt - Date.now()); state = 'paused'; setPaused(true); }
    else if (state === 'paused') { unlockAudio(); endAt = Date.now() + leftMs; state = 'running'; setPaused(false); wake(); }
    updateHud();
  }
  function plusMinute() {
    if (state === 'running') endAt += 60000; else if (state === 'paused') leftMs += 60000; else return;
    totalMs += 60000; $('totalTxt').textContent = fmtShort(totalMs); updateHud();
  }
  function stopTimer() { state = 'setup'; sleepOK(); stopAlarm(); document.title = '無人機計時器'; fadeThen(() => { fly.rest(); show('setup'); }); }
  function finish() {
    state = 'done'; leftMs = 0; updateHud();
    fly.fall(); alarm();
    try { if (navigator.vibrate) navigator.vibrate([400, 160, 400, 160, 700]); } catch (e) {}
    document.title = '時間到！無人機計時器';
    setTimeout(() => { if (state === 'done') { show('done'); sleepOK(); } }, 1700);
  }
  function check() {
    if (state !== 'running') return;
    leftMs = Math.max(0, endAt - Date.now());
    const sec = Math.ceil(leftMs / 1000);
    if (sec <= 3 && sec >= 1 && sec !== lastBeep) { lastBeep = sec; tick(); }
    if (leftMs <= 0) finish();
  }
  function updateHud() {

        const c = Math.cos(yaw), sn = Math.sin(yaw), orbit = 0.7 * Math.sin(rt * 0.07);
        const ox = Math.sin(orbit) * 9.5, oz = Math.cos(orbit) * 9.5;
        tmp.set(pos.x + ox * c + oz * sn, pos.y + 3.2, pos.z - ox * sn + oz * c);
        look = V3(pos.x - sn * 4, pos.y + 0.2, pos.z - c * 4);
      } else {
        // falling, then lying in the sand
        still = true;
        const F = fall0; fallT += dt;
        const gy = Hj(pos.x, pos.z);
        if (!impact) {
          pos.set(F.p.x + F.vx * fallT, F.p.y - 0.5 * F.g * fallT * fallT, F.p.z + F.vz * fallT);
          rot.set(F.rot.x + F.spinX * fallT, F.rot.y, F.rot.z + F.spinZ * fallT * 0.6);
          const g2 = Hj(pos.x, pos.z);
          if (pos.y <= g2 + 0.15) {
            impact = { x: pos.x, z: pos.z, y: g2, t: fallT };
            pos.y = g2 + 0.05; rot.set(0.12, F.rot.y + 0.4, 0.55);
            for (let i = 0; i < ND; i++) {
              const a = Math.random() * TAU, sp = 1.5 + Math.random() * 3.5;
              dustV[i] = [Math.cos(a) * sp, 1.5 + Math.random() * 3, Math.sin(a) * sp];
              dustP.set([pos.x, g2 + 0.3, pos.z], i * 3);
            }
          }
        } else {
          pos.y = impact.y + 0.05;
        }
        if (impact) {
          const age = fallT - impact.t;
          for (let i = 0; i < ND; i++) {
            const v = dustV[i];
            dustP[i * 3] += v[0] * dt; dustP[i * 3 + 1] += (v[1] - 2.2 * age) * dt; dustP[i * 3 + 2] += v[2] * dt;
            v[0] *= 0.97; v[2] *= 0.97;
          }
          dust.geometry.attributes.position.needsUpdate = true;
          dust.material.opacity = 0.8 * Math.max(0, 1 - age / 2.2);
          const a = 0.6 + age * 0.05;
          tmp.set(impact.x + Math.sin(a) * 6.5, impact.y + 2.0, impact.z + Math.cos(a) * 6.5);
          look = V3(impact.x, impact.y + (innerHeight > innerWidth ? -1.2 : 0.2), impact.z);
        } else {
          tmp.copy(camPos); look = pos.clone();
        }
        void gy;
      }
      // camera: glides after its target, never into a dune
      tmp.y = Math.max(tmp.y, Hj(tmp.x, tmp.z) + 1.2);
      const k = 1 - Math.exp(-dt * (mode === 'fly' ? 2.2 : mode === 'fall' ? 2.6 : 1.6));
      camPos.lerp(tmp, k); camLook.lerp(look, 1 - Math.exp(-dt * 4));
      cam.position.copy(camPos); cam.lookAt(camLook);
      sky.position.copy(cam.position);
      drone.position.copy(pos); drone.rotation.set(rot.x, rot.y, rot.z);
      props.forEach((b, i) => { b.rotation.y = still ? 0.6 * i : rt * 50 * (i % 2 ? 1 : -1); });
      discs.forEach(d => { d.visible = !still; });
      const gy = Hj(pos.x, pos.z), hgt = pos.y - gy;
      shadow.position.set(pos.x, gy + 0.06, pos.z); shadow.scale.setScalar(2.4 + hgt * 0.08); shadow.material.opacity = 0.55 * (1 - smooth(0, 20, hgt));
      for (let i = 0; i < NS; i++) {
        const x = cam.position.x + ((hash(i + 100) * 60 + 4 * rt * (0.6 + hash(i + 101))) % 60) - 30;
        const z = cam.position.z + hash(i + 102) * 60 - 30;
        sandP[i * 3] = x; sandP[i * 3 + 1] = Hj(x, z) + hash(i + 103) * 1.4 + 0.1 * Math.sin(rt * 3 + i); sandP[i * 3 + 2] = z;
      }
      sand.geometry.attributes.position.needsUpdate = true;
    }

    function resize() {
      const w = innerWidth, h = innerHeight;
      R.setSize(w, h, false); cam.aspect = w / h; cam.fov = w / h < 0.8 ? 66 : 55; cam.updateProjectionMatrix();
    }
    addEventListener('resize', resize); resize();
    fly.rest();
    let last = performance.now();
    (function loop(now) {
      const dt = Math.min(0.1, (now - last) / 1000); last = now;
      check(); if (state === 'running' || state === 'paused') updateHud();
      update(reduce && mode === 'rest' ? dt * 0.3 : dt, now);
      if (state !== 'setup' || $('fade').classList.contains('on')) R.render(sc, cam);
      requestAnimationFrame(loop);
    })(performance.now());
  }
  updateHud();
})();
</script>
</body>
</html>
